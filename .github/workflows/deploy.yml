name: Deploy to Hostinger

on:
  push:
    branches:
      - test # Change this to main when you're ready for production

jobs:
  web-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies & Build Frontend
        run: |
          cd apps/client-site
          npm install
          npm run build
          
      - name: FTP Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # This deploys the built frontend files
          local-dir: apps/client-site/dist/
          # Deploy to Hostinger's standard public directory. Change if necessary.
          server-dir: public_html/

      - name: FTP Deploy Backend to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # This deploys the backend source code
          local-dir: backend/
          # Deploy to a dedicated backend folder adjacent to public_html
          server-dir: backend/
